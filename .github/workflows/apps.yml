# Monta os aplicativos do Logic Academy e publica para download em
# https://github.com/matoseb-stack/mapa-de-estudos/releases/tag/apps
#  - Android: LogicAcademy.apk (instalar fora da Play Store)
#  - Windows: LogicAcademy-Instalador.exe e LogicAcademy-Portatil.exe
# Os apps abrem o site oficial, então tudo o que muda no site aparece neles sem reinstalar.
name: Aplicativos (Android e Windows)

on:
  workflow_dispatch:
  push:
    branches: [main, producao]
    paths: ["apps/**", ".github/workflows/apps.yml", "icones-oficial/**"]

permissions:
  contents: write

concurrency:
  group: apps
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # mesma assinatura entre as versões (enquanto o cache existir), para atualizar sem desinstalar
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-assinatura-v1
      - name: Montar o projeto Android
        working-directory: apps/android
        run: |
          npm install --no-audit --no-fund
          npx cap add android
          node preparar-android.js
          npx cap sync android
      - name: Gerar o APK
        working-directory: apps/android/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -q
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/LogicAcademy.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: LogicAcademy.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Gerar os .exe
        working-directory: apps/windows
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          cp ../../icones-oficial/icone-512.png icone.png
          npm install --no-audit --no-fund
          npx electron-builder --win nsis portable --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            apps/windows/dist/LogicAcademy-Instalador.exe
            apps/windows/dist/LogicAcademy-Portatil.exe

  publicar:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: saida
          merge-multiple: true
      - name: Publicar para download (link fixo)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          ls -la saida
          gh release delete apps --repo "$REPO" --yes --cleanup-tag || true
          gh release create apps --repo "$REPO" --target "${{ github.sha }}" --title "Aplicativos do Logic Academy" \
            --notes "Android: baixe LogicAcademy.apk e instale (permita instalar apps desta fonte). Windows: LogicAcademy-Instalador.exe (instala) ou LogicAcademy-Portatil.exe (abre sem instalar). Os apps abrem o site oficial, então ficam sempre atualizados." \
            saida/*
