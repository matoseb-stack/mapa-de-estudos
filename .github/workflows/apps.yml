# Monta os aplicativos do Logic Academy e publica para download em
# https://github.com/matoseb-stack/mapa-de-estudos/releases/tag/apps
#  - Android: LogicAcademy.apk (instalar fora da Play Store)
#  - Windows: LogicAcademy-Instalador.exe e LogicAcademy-Portatil.exe
# Os apps abrem o site oficial, então tudo o que muda no site aparece neles sem reinstalar.
name: Aplicativos (Android e Windows)

# O app de Android traz o site dentro dele, então é montado de novo a cada versão do site:
#  - ramo main (site de testes)  → app de testes:  releases/download/apps-teste/LogicAcademy.apk
#  - ramo producao (site oficial) → app oficial:    releases/download/apps/LogicAcademy.apk
on:
  workflow_dispatch:
  push:
    branches: [main, producao]

permissions:
  contents: write

concurrency:
  group: apps
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    outputs:
      versao: ${{ steps.ver.outputs.versao }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # mesma assinatura entre as versões (enquanto o cache existir), para atualizar sem desinstalar
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-assinatura-v1
      - name: Colocar o site dentro do app (sem as imagens das provas, que vêm do site oficial)
        run: |
          W=apps/android/www
          rm -rf "$W" && mkdir -p "$W/questoes" "$W/vendor/firebasejs/10.12.2"
          cp index.html firebase-config.js manifest.webmanifest versao.json "$W/"
          cp -r js css icones idiomas sons midia simulados "$W/"
          cp icones-oficial/*.png "$W/icones/"
          cp questoes/*.json "$W/questoes/"
          for f in firebase-app-compat.js firebase-auth-compat.js firebase-firestore-compat.js; do
            curl -sSfL -o "$W/vendor/firebasejs/10.12.2/$f" "https://www.gstatic.com/firebasejs/10.12.2/$f"
          done
          # canal (oficial/testes) e nº da montagem: o app compara com a última publicação e pede para atualizar
          CANAL=$([ "${{ github.ref_name }}" = "producao" ] && echo oficial || echo teste)
          sed -i "s/const APP_CANAL=\"oficial\",APP_BUILD=0;/const APP_CANAL=\"$CANAL\",APP_BUILD=${{ github.run_number }};/" "$W/index.html"
          grep -q "APP_BUILD=${{ github.run_number }};" "$W/index.html"
          du -sh "$W"
          echo "APP_VERSAO=$(grep -o 'APP_VERSAO="[0-9.]*"' index.html | head -1 | cut -d'"' -f2)" >> "$GITHUB_ENV"
      - id: ver
        run: echo "versao=$APP_VERSAO" >> "$GITHUB_OUTPUT"
      - name: Montar o projeto Android
        working-directory: apps/android
        run: |
          npm install --no-audit --no-fund
          npx cap add android
          node preparar-android.js
          npx cap sync android
      - name: Gerar o APK
        working-directory: apps/android/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -q
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/LogicAcademy.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: LogicAcademy.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Gerar os .exe
        working-directory: apps/windows
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          cp ../../icones-oficial/icone-512.png icone.png
          npm install --no-audit --no-fund
          npx electron-builder --win nsis portable --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            apps/windows/dist/LogicAcademy-Instalador.exe
            apps/windows/dist/LogicAcademy-Portatil.exe

  publicar:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: saida
          merge-multiple: true
      - name: Publicar para download (link fixo)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name == 'producao' && 'apps' || 'apps-teste' }}
        run: |
          ls -la saida
          if [ "$TAG" = "apps" ]; then T="Aplicativos do Logic Academy"; X=""; else T="Aplicativos do Logic Academy (testes)"; X="--prerelease"; fi
          # o app lê "versão X" e "nº N" deste título para saber se há app novo
          T="$T · versão ${{ needs.android.outputs.versao }} · nº ${{ github.run_number }}"
          gh release delete "$TAG" --repo "$REPO" --yes --cleanup-tag || true
          gh release create "$TAG" --repo "$REPO" --target "${{ github.sha }}" --title "$T" $X \
            --notes "Android: baixe LogicAcademy.apk e instale (permita instalar apps desta fonte); o app traz o site dentro, funciona sem internet e usa a mesma conta. Windows: LogicAcademy-Instalador.exe (instala) ou LogicAcademy-Portatil.exe (abre sem instalar)." \
            saida/*
