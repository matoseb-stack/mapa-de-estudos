# Publica o site oficial (Firebase Hosting) e as regras do Firestore
# sempre que o ramo "producao" recebe mudanças. O ramo "main" continua no GitHub Pages, como site de testes.
name: Publicar no Firebase

on:
  push:
    branches: [producao]
  workflow_dispatch:

concurrency:
  group: firebase-producao
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Credencial do Firebase
        env:
          CHAVE: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$CHAVE" ]; then echo "::error::Falta o segredo FIREBASE_SERVICE_ACCOUNT no repositório (Settings > Secrets and variables > Actions)."; exit 1; fi
          printf '%s' "$CHAVE" > "$RUNNER_TEMP/chave.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/chave.json" >> "$GITHUB_ENV"
      - name: Ícone oficial preto (o laranja fica só no site de testes)
        run: |
          cp icones-oficial/*.png icones/
          sed -i 's/"theme_color": "#f97316"/"theme_color": "#0a0a0a"/' manifest.webmanifest
      - name: Versão publicada (o site e os apps comparam com ela e avisam para atualizar)
        run: |
          V=$(grep -o 'APP_VERSAO="[0-9.]*"' index.html | head -1 | cut -d'"' -f2)
          jq --arg v "$V" '.site=$v' versao.json > versao.tmp && mv versao.tmp versao.json && cat versao.json
      - name: Criar o site logicacademy (se ainda não existir)
        run: npx --yes firebase-tools@13 hosting:sites:create logicacademy --project mapa-de-estudos-d6eca --non-interactive || echo "site já existe"
      - name: Autorizar o domínio no login (Google/Apple)
        run: |
          gcloud auth activate-service-account --key-file="$GOOGLE_APPLICATION_CREDENTIALS" --quiet
          T=$(gcloud auth print-access-token)
          U=https://identitytoolkit.googleapis.com/admin/v2/projects/mapa-de-estudos-d6eca/config
          H=(-H "Authorization: Bearer $T" -H "x-goog-user-project: mapa-de-estudos-d6eca" -H "Content-Type: application/json")
          D=$(curl -sS -f "${H[@]}" "$U" | jq -c '.authorizedDomains')
          echo "domínios atuais: $D"
          if [ -z "$D" ] || [ "$D" = "null" ] || [ "$D" = "[]" ]; then echo "::warning::Não consegui ler os domínios autorizados; adicione o domínio à mão em Authentication > Configurações."; exit 0; fi
          # site oficial e site de testes (GitHub Pages da conta matoseb-stack) precisam estar autorizados no login
          if ! echo "$D" | jq -e 'index("logicacademy.web.app") and index("matoseb-stack.github.io") and (index("logic-academy.web.app")|not)' >/dev/null; then
            N=$(echo "$D" | jq -c '. - ["logic-academy.web.app","logic-academy.firebaseapp.com"] + ["logicacademy.web.app","logicacademy.firebaseapp.com","matoseb-stack.github.io"] | unique')
            curl -sS -f -X PATCH "${H[@]}" "$U?updateMask=authorizedDomains" -d "{\"authorizedDomains\":$N}" | jq -c '.authorizedDomains' || echo "::warning::Não consegui autorizar o domínio; adicione à mão em Authentication > Configurações."
          fi
      - name: Liberar espaço da hospedagem (guarda só as últimas versões)
        # autorizado pelo dono: o plano grátis tem limite de armazenamento e cada publicação guarda uma cópia inteira do site
        run: |
          T=$(gcloud auth print-access-token)
          H=(-H "Authorization: Bearer $T" -H "x-goog-user-project: mapa-de-estudos-d6eca" -H "Content-Type: application/json")
          B=https://firebasehosting.googleapis.com/v1beta1
          for SITE in logicacademy mapa-de-estudos-d6eca; do
            curl -sS -X PATCH "${H[@]}" "$B/sites/$SITE/channels/live?updateMask=retainedReleaseCount" -d '{"retainedReleaseCount":3}' | jq -c '{canal:.name,guardar:.retainedReleaseCount}' || true
            ATUAL=$(curl -sS "${H[@]}" "$B/sites/$SITE/channels/live/releases?pageSize=3" | jq -r '[.releases[]?.version.name] | unique | .[]' || true)
            VS=$(curl -sS "${H[@]}" "$B/sites/$SITE/versions?pageSize=100" | jq -r '[.versions[]? | select(.status=="FINALIZED") | .name] | .[]' || true)
            N=0
            for V in $VS; do
              if echo "$ATUAL" | grep -qx "$V"; then continue; fi
              C=$(curl -sS -o /dev/null -w "%{http_code}" -X DELETE "${H[@]}" "$B/$V" || true)
              case "$C" in 2*) N=$((N+1));; esac
            done
            echo "$SITE: $N versões antigas apagadas"
          done
      - name: Publicar site
        run: npx --yes firebase-tools@13 deploy --only hosting --project mapa-de-estudos-d6eca --non-interactive --force
      - name: Publicar regras
        # se a conta de serviço não tiver o papel "Administrador do Firebase", o site sai mesmo assim e fica só o aviso
        run: npx --yes firebase-tools@13 deploy --only firestore:rules --project mapa-de-estudos-d6eca --non-interactive --force || echo "::warning::Não consegui publicar as regras (sem permissão). Dê o papel Administrador do Firebase à conta de serviço no Google Cloud > IAM."
      - name: Publicar pagamentos do Pro (Mercado Pago)
        # precisa do plano Blaze no Firebase e do segredo MERCADOPAGO_ACCESS_TOKEN no GitHub; sem eles, o resto do site sai normalmente
        env:
          MP: ${{ secrets.MERCADOPAGO_ACCESS_TOKEN }}
        run: |
          if [ -z "$MP" ]; then echo "::warning::Sem o segredo MERCADOPAGO_ACCESS_TOKEN: os pagamentos do Pro não foram publicados."; exit 0; fi
          (cd functions && npm ci --omit=dev)
          printf '%s' "$MP" | npx --yes firebase-tools@13 functions:secrets:set MP_ACCESS_TOKEN --data-file=- --project mapa-de-estudos-d6eca --non-interactive --force \
            || { echo "::warning::Não consegui guardar o token do Mercado Pago (a conta de serviço precisa do papel Administrador do Secret Manager)."; exit 0; }
          npx --yes firebase-tools@13 deploy --only functions --project mapa-de-estudos-d6eca --non-interactive --force \
            || echo "::warning::Não consegui publicar as funções de pagamento (o projeto precisa estar no plano Blaze e a conta de serviço precisa dos papéis de Cloud Functions)."
      - name: Apagar credencial
        if: always()
        run: rm -f "$RUNNER_TEMP/chave.json"
